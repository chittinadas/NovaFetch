name: Windows Build
on: [push, pull_request, workflow_dispatch]
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: lukka/run-vcpkg@v11
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - run: cmake --preset windows-release
   - run: cmake --build --preset windows-release
   - run: ctest --test-dir build -C Release --output-on-failure
   - shell: pwsh
     run: |
      $e=Get-ChildItem build -Filter NovaFetch.exe -Recurse | Select-Object -First 1
      if(!$e){throw 'Executable missing'}
      New-Item -ItemType Directory -Force dist/NovaFetch | Out-Null
      Copy-Item $e.FullName dist/NovaFetch/
      Compress-Archive dist/NovaFetch/* NovaFetch-Portable-Windows-x64.zip -Force
   - uses: actions/upload-artifact@v4
     with:
      name: NovaFetch-Portable-Windows-x64
      path: NovaFetch-Portable-Windows-x64.zip
